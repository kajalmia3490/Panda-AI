<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panda (প্যান্ডা) | Local Coding AI Agent</title>
  <!-- Google Fonts: Inter, Noto Sans Bengali, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">
      <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar (সাইডবার দেখান/লুকান)">
        ☰
      </button>
      <div class="brand-icon">🐼</div>
      <div>
        <span class="brand-title">Panda</span>
        <span class="brand-badge">AI Assistant</span>
      </div>
    </div>
    <div class="header-controls">
      <label for="model-select" style="font-size:0.8rem; color:var(--text-dim);">Model:</label>
      <select id="model-select" class="model-select">
        <option value="gemini-2.5-flash-lite" selected>Gemini 2.5 Flash Lite (High Reliability)</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
        <option value="gemini-flash-latest">Gemini Flash Latest</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
      </select>
      <div id="status-badge" class="status-badge">
        <div class="status-dot"></div>
        <span>Connecting...</span>
      </div>
      <div class="voice-controls-wrapper" style="display:flex; align-items:center; gap:6px;">
        <label for="voice-select" style="font-size:0.8rem; color:var(--text-dim);" title="Select Voice">🗣️ Voice:</label>
        <select id="voice-select" class="model-select" style="max-width:180px;" title="Choose speech voice">
          <option value="auto">Auto (Bangla bn-BD)</option>
        </select>
        <button id="voice-mute-btn" class="voice-mute-btn" onclick="toggleVoiceMute()" title="Toggle voice response (অডিও উত্তর অন/অফ)">
          🔊 Voice: ON
        </button>
      </div>
    </div>
  </header>

  <!-- Main App Layout -->
  <div class="app-container">
    <!-- Sidebar: Conversation History -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div style="display:flex; align-items:center; gap:6px;">
          <span>Chats</span>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          <button class="new-chat-btn" onclick="createNewChatSession()" title="New Chat">➕ New</button>
          <button class="clear-all-btn" onclick="clearAllConversations()" title="Clear All Chats">🗑️ Clear</button>
          <button class="sidebar-close-btn" onclick="toggleSidebar()" title="Collapse Sidebar (সাইডবার বন্ধ করুন)">◀</button>
        </div>
      </div>
      <div id="conversation-history-list" class="conversation-history-list">
        <!-- Live session items recorded here -->
      </div>
    </aside>

    <!-- Main Chat View -->
    <main class="main-chat">
      <div id="chat-messages" class="chat-messages"></div>

      <!-- Input Area -->
      <div class="chat-input-area">
        <!-- Attachment Previews Container -->
        <div id="attachment-preview-container" class="attachment-preview-container"></div>

        <div class="input-box-wrapper">
          <input type="file" id="file-input" style="display:none;" multiple accept="image/*,.pdf,.txt,.py,.js,.html,.css,.json,.md,.csv,.log">
          <button id="attach-btn" class="attach-btn" type="button" title="Add Attachments (ছবি, ডকুমেন্ট বা ফাইল যুক্ত করুন)">
            📎
          </button>
          <button id="mic-btn" class="mic-btn" onclick="toggleSpeechRecognition()" title="Voice Command (Speak in English or Hindi)">
            <span id="mic-icon">🎤</span>
          </button>
          <textarea
            id="user-input"
            class="chat-input"
            placeholder="Type or speak (e.g. 'Hey Panda', 'File Explorer open karo', 'Install Chrome')..."
            rows="1"
          ></textarea>
          <button id="send-btn" class="send-btn">
            Send <span>↵</span>
          </button>
        </div>
        <div class="input-hints">
          <span id="voice-status-text">🎤 Click microphone to speak (English or Hindi)</span>
          <a class="reset-chat-link" onclick="resetChat()">Clear Session</a>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
